[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farsi-faker"
dynamic = ["version"]
description = "Generate Persian/Farsi names for testing and development"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ali Sadeghi Aghili", email = "alisadeghiaghili@gmail.com"}
]
maintainers = [
    {name = "Ali Sadeghi Aghili", email = "alisadeghiaghili@gmail.com"}
]
keywords = [
    "persian-names", "farsi-names", "iranian-names",
    "fake-data", "test-data", "mock-data",
    "name-generator", "data-generator",
    "faker", "farsi", "persian", "iranian",
    "names", "generator", "testing", "mock",
    "dataset", "synthetic", "sample",
    "development", "automation", "fixtures",
    "localization", "i18n",
    "reproducible", "lightweight", "fast",
    "فارسی", "ایرانی", "پارسی",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/alisadeghiaghili/farsi-faker"
Documentation = "https://github.com/alisadeghiaghili/farsi-faker#readme"
Repository = "https://github.com/alisadeghiaghili/farsi-faker"
"Bug Tracker" = "https://github.com/alisadeghiaghili/farsi-faker/issues"
Changelog = "https://github.com/alisadeghiaghili/farsi-faker/releases"

[project.optional-dependencies]
pandas = ["pandas>=1.3.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pandas>=1.3.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[tool.setuptools]
packages = ["farsi_faker", "farsi_faker.data"]
zip-safe = false

[tool.setuptools.package-data]
farsi_faker = ["py.typed", "data/*.pkl"]

[tool.setuptools.dynamic]
version = {attr = "farsi_faker._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
minversion = "7.0"

[tool.coverage.run]
source = ["farsi_faker"]
omit = ["tests/*", "scripts/*"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["farsi_faker"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
